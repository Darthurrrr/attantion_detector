name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  server:
    name: Сервер (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Зависимости
        run: pip install fastapi uvicorn "SQLAlchemy>=2" pydantic "psycopg[binary]" pytest httpx
      - name: Тесты игровых систем
        working-directory: server
        run: python -m pytest -q

  flutter:
    name: Клиент (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Зависимости
        working-directory: flutter_app
        run: flutter pub get

      # Ошибки анализа попадают в аннотации запуска — их видно в интерфейсе
      # GitHub и можно прочитать через API.
      - name: Анализ
        working-directory: flutter_app
        run: |
          set +e
          flutter analyze --no-pub --no-fatal-infos > /tmp/analyze.txt 2>&1
          code=$?
          python3 ../tools/analyze_report.py /tmp/analyze.txt || true
          tail -n 20 /tmp/analyze.txt
          exit $code

      # Полный отчёт складывается комментарием к PR: логи запуска не всегда
      # доступны для скачивания, а список замечаний нужен целиком.
      - name: Отчёт анализа в PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -s /tmp/analyze.txt ]; then exit 0; fi
          {
            printf 'Автоматический отчёт `flutter analyze` (коммит %s).\n\n```\n' "$GITHUB_SHA"
            grep -E '^\s*(error|warning)\s+•' /tmp/analyze.txt || true
            printf '\n```\n\nВсего строк: %s; из них ошибок: %s.\n' \
              "$(grep -cE '^\s*(error|warning|info)\s+•' /tmp/analyze.txt || true)" \
              "$(grep -cE '^\s*error\s+•' /tmp/analyze.txt || true)"
          } > /tmp/comment.md
          gh pr comment "$NUMBER" --body-file /tmp/comment.md --edit-last --create-if-none

      - name: Тесты
        working-directory: flutter_app
        run: |
          set +e
          flutter test --reporter expanded > /tmp/flutter-test.txt 2>&1
          code=$?
          tail -n 60 /tmp/flutter-test.txt
          if [ "$code" -ne 0 ]; then
            # Последние строки доступны в аннотациях, даже если загрузка логов недоступна.
            while IFS= read -r line; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/'%0D'}
              echo "::error::$line"
            done < <(tail -n 35 /tmp/flutter-test.txt)
          fi
          exit $code
