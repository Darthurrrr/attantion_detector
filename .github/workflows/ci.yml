name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  server:
    name: Сервер (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Зависимости
        run: pip install fastapi uvicorn "SQLAlchemy>=2" pydantic "psycopg[binary]" pytest httpx
      - name: Тесты игровых систем
        working-directory: server
        run: python -m pytest -q

  flutter:
    name: Клиент (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Зависимости
        working-directory: flutter_app
        run: flutter pub get

      - name: Анализ
        id: analyze
        working-directory: flutter_app
        run: |
          set +e
          flutter analyze --no-pub > /tmp/analyze.txt 2>&1
          code=$?
          tail -c 60000 /tmp/analyze.txt
          {
            echo 'REPORT<<EOF_REPORT'
            echo 'flutter analyze:'
            cat /tmp/analyze.txt
            echo 'EOF_REPORT'
          } >> "$GITHUB_OUTPUT"
          exit $code

      - name: Тесты
        working-directory: flutter_app
        run: flutter test

      # Отчёт анализа складывается в комментарий к PR, чтобы его можно было
      # прочитать без доступа к скачиванию логов.
      - name: Отчёт анализа в PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          REPORT: ${{ steps.analyze.outputs.REPORT }}
        run: |
          body=$(printf '%s\n\n```\n%s\n```' "Автоматический отчёт CI по ветке \`$GITHUB_HEAD_REF\` (коммит $GITHUB_SHA)." "$REPORT")
          printf '%s' "$body" > /tmp/comment.md
          gh pr comment "$NUMBER" --body-file /tmp/comment.md
