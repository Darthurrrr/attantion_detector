name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  server:
    name: Сервер (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Зависимости
        run: pip install fastapi uvicorn "SQLAlchemy>=2" pydantic "psycopg[binary]" pytest httpx
      - name: Тесты игровых систем
        working-directory: server
        run: python -m pytest -q

  flutter:
    name: Клиент (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Зависимости
        working-directory: flutter_app
        run: flutter pub get

      # Ошибки анализа попадают в аннотации запуска — их видно в интерфейсе
      # GitHub и можно прочитать через API.
      - name: Анализ
        working-directory: flutter_app
        run: |
          set +e
          flutter analyze --no-pub > /tmp/analyze.txt 2>&1
          code=$?
          python3 - <<'PY'
          import re, pathlib
          lines = pathlib.Path('/tmp/analyze.txt').read_text(errors='replace').splitlines()
          pat = re.compile(r'^\s*(error|warning|info)\s+•\s+(.*?)\s+•\s+(.+?):(\d+):(\d+)\s+•\s+(\S+)\s*$')
          shown = 0
          for line in lines:
            m = pat.match(line)
            if not m:
                continue
            level, msg, path, row, col, rule = m.groups()
            kind = 'error' if level == 'error' else 'warning'
            print(f'::{kind} file={path},line={row},col={col}::{msg} ({rule})')
            shown += 1
            if shown >= 40:
                break
          if shown == 0:
              text = ' '.join(lines)[-1200:] or 'нет вывода'
              print(f'::error::flutter analyze не дал разбираемых строк: {text}')
          print(f'::notice::строк с замечаниями: {shown}')
          PY
          tail -n 40 /tmp/analyze.txt
          exit $code

      - name: Тесты
        working-directory: flutter_app
        run: flutter test
