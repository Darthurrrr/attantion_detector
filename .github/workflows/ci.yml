name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  server:
    name: Сервер (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Зависимости
        run: pip install fastapi uvicorn "SQLAlchemy>=2" pydantic "psycopg[binary]" pytest httpx
      - name: Тесты игровых систем
        working-directory: server
        run: python -m pytest -q

  flutter:
    name: Клиент (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Зависимости
        working-directory: flutter_app
        run: flutter pub get

      # Ошибки анализа попадают в аннотации запуска — их видно в интерфейсе
      # GitHub и можно прочитать через API.
      - name: Анализ
        working-directory: flutter_app
        run: |
          set +e
          flutter analyze --no-pub > /tmp/analyze.txt 2>&1
          code=$?
          python3 ../tools/analyze_report.py /tmp/analyze.txt || true
          tail -n 20 /tmp/analyze.txt
          exit $code

      - name: Тесты
        working-directory: flutter_app
        run: flutter test
